<body><main><header><strong>notme · 请求审核</strong></header><h1>允许这个页面的请求？</h1><p id="source" class="target"></p><section class="banner"><p>以下目标请求已被拦截。允许后，请回原页面再次点击“继续”或重试。</p><p>仅当前标签页、当前页面有效，刷新、离开或关闭页面后失效。只修改发往已审核域名的请求头，不改来源页面的语言、时区或请求正文。首次伪装需授予来源网站权限。</p></section><ul id="destinations"></ul><section class="banner"><label><input id="language" type="checkbox" checked> 伪装语言请求头（跟随出口或手动时区设置）</label><br><label><input id="identity" type="checkbox" checked> 伪装浏览器标识请求头</label></section><p id="status" role="status"></p><p id="error" role="alert"></p><p id="result" role="status"></p><div class="actions"><button id="allow" disabled>允许本页请求</button><button id="retry">重新检查</button><button id="back">返回原页面</button><button id="close">保持拦截并关闭</button></div></main></body></html>
